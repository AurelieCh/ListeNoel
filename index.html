<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Ma liste au Père Noël ✨</title>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
        <style>
            :root{--pink:#ff7ac6;--pink2:#ffc2e8;--gold:#ffe38a;--line:rgba(255,255,255,.4);box-sizing:border-box}
            *{box-sizing:border-box}
            html,body{height:100%;margin:0}
            body{font-family:'Fredoka',system-ui,sans-serif;color:#fff;overflow:hidden;
            background:radial-gradient(circle at 15% 10%,#4f7bff 0,transparent 38%),radial-gradient(circle at 90% 20%,#b24ad0 0,transparent 32%),linear-gradient(175deg,#050c3a,#14339f 60%,#2a1a7a);
            padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
            #snow{position:fixed;inset:0;pointer-events:none;z-index:1}
            .star{position:fixed;pointer-events:none;z-index:0;color:var(--gold);animation:tw 3s infinite ease-in-out}
            @keyframes tw{50%{opacity:.15;transform:scale(.6)}}
            .ground{position:fixed;left:-10%;width:120%;bottom:-9dvh;height:17dvh;border-radius:50%;background:linear-gradient(#fff,#cfe0ff);box-shadow:0 -6px 30px rgba(180,210,255,.6);z-index:0}
            #tree{position:fixed;left:50%;bottom:3dvh;height:92dvh;transform:translateX(-50%);z-index:0;opacity:.9;filter:drop-shadow(0 0 30px rgba(255,150,220,.35))}
            .bl{animation:bl 1.6s infinite}
            @keyframes bl{50%{opacity:.35}}
            .wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:6px 12px 8px;gap:6px}
            .lights{display:flex;justify-content:space-around;height:20px;flex:none;margin:0 -12px;border-top:2px solid #0c2a14}
            .lights i{width:9px;height:14px;border-radius:50% 50% 55% 55%;margin-top:3px;animation:bl 1.6s infinite}
            header{flex:none;display:flex;align-items:center;justify-content:center;gap:12px}
            .dog{height:clamp(54px,11dvh,100px);width:auto;cursor:pointer;filter:drop-shadow(0 4px 10px rgba(255,160,220,.7));animation:hop 3s infinite ease-in-out}
            @keyframes hop{50%{transform:translateY(-5px)}}
            .tail{transform-origin:150px 150px;animation:wag .5s infinite alternate}
            @keyframes wag{to{transform:rotate(22deg)}}
            h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(1.3rem,4.6vw,2.5rem);margin:0;line-height:1.1;
            background:linear-gradient(90deg,#a8d4ff,var(--pink2),var(--gold),#a8d4ff);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
            @keyframes sh{to{background-position:250% 0}}
            #bub{font-size:clamp(.7rem,1.7dvh,.95rem);font-weight:600;margin-top:2px}
            .bar{height:9px;border-radius:99px;background:rgba(0,0,10,.4);overflow:hidden;border:1px solid var(--line);margin-top:4px;width:min(300px,60vw)}
            .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6aa8ff,var(--pink),var(--gold));transition:width .6s}
            .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:clamp(6px,1.6dvh,16px);margin-bottom:5dvh}
            @media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);margin-bottom:3dvh}}
            .card{position:relative;min-height:0;border-radius:18px;padding:clamp(6px,1.4dvh,14px);display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;overflow:hidden;
            background:linear-gradient(145deg,rgba(40,60,170,.55),rgba(150,60,170,.4));border:1.5px solid var(--line);backdrop-filter:blur(7px);box-shadow:0 8px 22px rgba(5,10,60,.5),inset 0 0 26px rgba(140,180,255,.2);transition:transform .25s,box-shadow .25s}
            .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(255,122,198,.5)}
            .bow{position:absolute;top:2px;right:6px;font-size:clamp(1rem,3dvh,1.5rem);transform:rotate(12deg)}
            .emoji{line-height:1;display:flex;justify-content:center}.emoji svg{height:clamp(34px,7.5dvh,66px);width:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
            .card h2{margin:0;font-size:clamp(.72rem,1.9dvh,1.05rem);line-height:1.15;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
            .price{font-size:.6rem;opacity:.7;letter-spacing:.2px}
            .row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
            .btn{text-decoration:none;color:#3a0a2e;font-weight:700;font-size:clamp(.7rem,1.7dvh,.9rem);padding:clamp(3px,.8dvh,7px) 12px;border-radius:99px;background:linear-gradient(90deg,var(--pink2),var(--pink));box-shadow:0 3px 10px rgba(255,122,198,.5)}
            label.chk{display:flex;gap:4px;align-items:center;font-weight:600;cursor:pointer;font-size:clamp(.68rem,1.6dvh,.85rem)}
            label.chk input{width:17px;height:17px;accent-color:var(--pink)}
            .card.done{opacity:.65}.card.done h2{text-decoration:line-through}
            .sp{position:fixed;pointer-events:none;z-index:5;animation:fd 1s forwards}
            @keyframes fd{to{opacity:0;transform:translateY(24px) scale(.3) rotate(90deg)}}
            .heart{position:fixed;pointer-events:none;z-index:6;font-size:1.5rem;animation:up 1.4s forwards}
            @keyframes up{to{opacity:0;transform:translateY(-100px) scale(1.4)}}
        </style>
    </head>
    <body>
        <canvas id="snow"></canvas>
        <svg id="tree" viewBox="0 0 400 560" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fae74"/><stop offset="1" stop-color="#0d5a3c"/></linearGradient></defs>
        <rect x="178" y="440" width="44" height="70" rx="6" fill="#7a4a2b"/>
        <polygon points="200,200 50,450 350,450" fill="url(#g)" stroke="#7fe0b0" stroke-width="2"/>
        <polygon points="200,110 85,320 315,320" fill="url(#g)" stroke="#7fe0b0" stroke-width="2"/>
        <polygon points="200,40 120,200 280,200" fill="url(#g)" stroke="#7fe0b0" stroke-width="2"/>
        <path d="M135 175 Q200 215 265 175 M100 290 Q200 335 300 290 M70 425 Q200 475 330 425" stroke="#ffb3e1" stroke-width="5" fill="none" stroke-linecap="round"/>
        <polygon points="200,6 209,30 235,30 214,46 222,72 200,56 178,72 186,46 165,30 191,30" fill="#ffe38a" class="bl"/>
        <g class="bl"><circle cx="170" cy="150" r="7" fill="#6aa8ff"/><circle cx="232" cy="120" r="7" fill="#ff7ac6"/><circle cx="215" cy="180" r="7" fill="#ffe38a"/><circle cx="150" cy="250" r="8" fill="#ff7ac6"/><circle cx="240" cy="245" r="8" fill="#6aa8ff"/><circle cx="195" cy="280" r="8" fill="#ffe38a"/><circle cx="110" cy="390" r="9" fill="#ffe38a"/><circle cx="190" cy="370" r="9" fill="#6aa8ff"/><circle cx="270" cy="395" r="9" fill="#ff7ac6"/><circle cx="310" cy="430" r="8" fill="#6aa8ff"/><circle cx="130" cy="440" r="8" fill="#ff7ac6"/></g>
        <rect x="70" y="480" width="60" height="45" rx="4" fill="#6aa8ff"/><rect x="95" y="480" width="10" height="45" fill="#ffc2e8"/>
        <rect x="280" y="490" width="55" height="40" rx="4" fill="#ff7ac6"/><rect x="302" y="490" width="10" height="40" fill="#ffe38a"/>
        </svg>
        <div class="ground"></div>
        <div class="wrap">
            <div class="lights" id="lights"></div>
            <header>
                <svg class="dog" id="dog" viewBox="0 0 200 210" aria-label="Bichon maltais avec un bonnet de Père Noël">
                <g class="tail"><circle cx="152" cy="150" r="20" fill="#fff" stroke="#bcd3ff" stroke-width="3"/><circle cx="162" cy="138" r="14" fill="#fff" stroke="#bcd3ff" stroke-width="3"/></g>
                <ellipse cx="100" cy="168" rx="52" ry="34" fill="#fff" stroke="#bcd3ff" stroke-width="3"/>
                <circle cx="70" cy="196" r="13" fill="#fff" stroke="#bcd3ff" stroke-width="3"/><circle cx="130" cy="196" r="13" fill="#fff" stroke="#bcd3ff" stroke-width="3"/>
                <circle cx="54" cy="110" r="26" fill="#fff" stroke="#bcd3ff" stroke-width="3"/><circle cx="146" cy="110" r="26" fill="#fff" stroke="#bcd3ff" stroke-width="3"/>
                <circle cx="100" cy="100" r="50" fill="#fff" stroke="#bcd3ff" stroke-width="3"/>
                <circle cx="82" cy="98" r="7" fill="#1a1030"/><circle cx="118" cy="98" r="7" fill="#1a1030"/>
                <circle cx="84" cy="95" r="2.5" fill="#fff"/><circle cx="120" cy="95" r="2.5" fill="#fff"/>
                <ellipse cx="100" cy="117" rx="9" ry="6.5" fill="#1a1030"/>
                <path d="M100 123 Q100 134 90 134 M100 123 Q100 134 110 134" stroke="#1a1030" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <ellipse cx="66" cy="120" rx="8" ry="5" fill="#ffb3e1" opacity=".7"/><ellipse cx="134" cy="120" rx="8" ry="5" fill="#ffb3e1" opacity=".7"/>
                <path d="M56 62 Q100 -10 148 46 Q120 40 56 62Z" fill="#ff4f9a"/>
                <rect x="50" y="54" width="104" height="18" rx="9" fill="#fff" stroke="#bcd3ff" stroke-width="2"/>
                <circle cx="150" cy="44" r="12" fill="#fff" stroke="#bcd3ff" stroke-width="2"/>
                </svg>
                <div>
                    <h1>Ma liste au Père Noël</h1>
                    <div id="bub">Wouf ! 🎄 Clique-moi</div>
                    <div class="bar"><i id="pbar"></i></div>
                </div>
            </header>
            <section class="grid" id="grid"></section>
        </div>
        <script>
            const ICON={
            layton:`<svg viewBox='0 0 64 64'><ellipse cx='32' cy='50' rx='26' ry='7' fill='#1a1030' stroke='#ffc2e8' stroke-width='2'/><rect x='16' y='14' width='32' height='36' rx='5' fill='#1a1030' stroke='#ffc2e8' stroke-width='2'/><rect x='16' y='38' width='32' height='7' fill='#ff7ac6'/><text x='32' y='32' text-anchor='middle' font-size='16' font-weight='700' fill='#ffe38a'>?</text></svg>`,
            chaise:`<svg viewBox='0 0 64 64'><rect x='20' y='4' width='24' height='32' rx='9' fill='#ff7ac6' stroke='#fff' stroke-width='2'/><rect x='14' y='36' width='36' height='10' rx='5' fill='#6aa8ff' stroke='#fff' stroke-width='2'/><rect x='30' y='46' width='4' height='8' fill='#fff'/><path d='M14 60 L32 54 L50 60' stroke='#fff' stroke-width='4' fill='none' stroke-linecap='round'/></svg>`,
            bureau:`<svg viewBox='0 0 64 64'><rect x='6' y='28' width='52' height='6' rx='3' fill='#ffe38a' stroke='#fff' stroke-width='2'/><path d='M12 34 L8 58 M52 34 L56 58' stroke='#fff' stroke-width='4' stroke-linecap='round'/><rect x='18' y='6' width='28' height='18' rx='3' fill='#1a1030' stroke='#6aa8ff' stroke-width='2'/><rect x='30' y='24' width='4' height='4' fill='#fff'/><path d='M22 15 h20' stroke='#ff7ac6' stroke-width='3'/></svg>`,
            cartes:`<svg viewBox='0 0 64 64'><g transform='rotate(-12 24 34)'><rect x='8' y='10' width='28' height='42' rx='4' fill='#6aa8ff' stroke='#fff' stroke-width='2'/></g><g transform='rotate(10 42 34)'><rect x='28' y='10' width='28' height='42' rx='4' fill='#fff' stroke='#ff7ac6' stroke-width='2'/><circle cx='42' cy='31' r='9' fill='#ff7ac6'/><rect x='33' y='30' width='18' height='3' fill='#1a1030'/><circle cx='42' cy='31.5' r='3' fill='#fff' stroke='#1a1030' stroke-width='1.5'/></g></svg>`,
            ecran:`<svg viewBox='0 0 64 64'><path d='M3 14 Q32 22 61 14 L61 42 Q32 50 3 42Z' fill='#1a1030' stroke='#ffc2e8' stroke-width='2.5'/><path d='M8 20 Q32 26 56 20 L56 36 Q32 42 8 36Z' fill='#6aa8ff'/><path d='M8 30 Q32 36 56 30 L56 36 Q32 42 8 36Z' fill='#ff7ac6'/><rect x='29' y='47' width='6' height='8' fill='#fff'/><rect x='20' y='55' width='24' height='4' rx='2' fill='#fff'/></svg>`,
            manette:`<svg viewBox='0 0 64 64'><path d='M12 20 Q32 14 52 20 Q62 28 58 46 Q54 54 46 46 L40 40 H24 L18 46 Q10 54 6 46 Q2 28 12 20Z' fill='#1f8a5b' stroke='#ffe38a' stroke-width='2.5'/><circle cx='20' cy='28' r='5' fill='#0c2a14'/><circle cx='44' cy='34' r='5' fill='#0c2a14'/><polygon points='32,22 36,29 28,29' fill='#ffe38a'/><polygon points='28,29 32,36 24,36' fill='#ffe38a'/><polygon points='36,29 40,36 32,36' fill='#ffe38a'/></svg>`};
            const items=[
            {id:"layton",e:ICON.layton,t:"Professeur Layton et le Nouveau Monde à vapeur",p:"env. 65 €",u:"https://www.nintendo.com/fr-fr/Jeux/Jeux-Nintendo-Switch/Professeur-Layton-et-le-Nouveau-Monde-a-vapeur-2339757.html"},
            {id:"chaise",e:ICON.chaise,t:"Secretlab TITAN Evo 2022",p:"dès env. 549 €",u:"https://secretlab.eu/fr/products/titan-evo-2022-series?sku=M07-E24PU-KDA261R"},
            {id:"bureau",e:ICON.bureau,t:"IKEA UTESPELARE, bureau gamer noir",p:"env. 149 €",u:"https://www.ikea.com/fr/fr/p/utespelare-bureau-gamer-noir-80507627/?utm_source=google&utm_medium=organic-shopping&utm_campaign=shopping_feed&utm_content=free_google_shopping_clicks_Workspaces"},
            {id:"cartes",e:ICON.cartes,t:"Cartes Pokémon ME6, ME4 et 30 ans (toutes langues)",p:"prix variable",u:"https://www.google.com/search?q=cartes+pok%C3%A9mon+ME6+ME4+30+ans"},
            {id:"ecran",e:ICON.ecran,t:"Philips Evnia 49M2C8900",p:"env. 950 €",u:"https://www.grosbill.com/philips-evnia-49m2c8900-00-145385?utm_source=flux_awin&utm_campaign=comparateur_prix&utm_content=produit_06203833&utm_source=awin&sv1=affiliate&sv_campaign_id=287139&awc=13344_1794827792_3111c1012b6eed21a1046520f530a679"},
            {id:"manette",e:ICON.manette,t:"Manette Pro Switch 2, édition 40e anniv. Zelda",p:"99,99 €",u:"https://store.nintendo.com/fr-fr/manette-pro-nintendo-switch2-edition-40e-anniversaire-de-the-legend-of-zelda-support-dexposition-000000000010019437"}
            ];
            const bows=["🎀","🎁","🔔","⭐","🎄","🍬"];
            let saved={};try{saved=JSON.parse(localStorage.getItem("noel-done")||"{}")}catch(e){}
            let dbh=null;const els={};
            const grid=document.getElementById("grid");
            items.forEach((i,k)=>{
            const c=document.createElement("article");c.className="card";
            c.innerHTML=`<span class="bow">${bows[k%6]}</span><div class="emoji">${i.e}</div><h2>${i.t}</h2><div class="price">${i.p}</div>
            <div class="row"><a class="btn" href="${i.u}" target="_blank" rel="noopener">Voir 💝</a><label class="chk"><input type="checkbox"> Offert !</label></div>`;
            const inp=c.querySelector("input");
            inp.onchange=()=>{
            saved[i.id]=inp.checked;paint();
            try{localStorage.setItem("noel-done",JSON.stringify(saved))}catch(x){}
            if(dbh){try{dbh.doc("offert/"+i.id).set({v:inp.checked})}catch(x){}}
            if(inp.checked)say("Wouf wouf ! Merci ! 🐾");
            };
            els[i.id]={c,inp};grid.appendChild(c);
            });
            function paint(){
            let n=0;
            items.forEach(i=>{const on=!!saved[i.id];if(on)n++;els[i.id].inp.checked=on;els[i.id].c.classList.toggle("done",on)});
            document.getElementById("pbar").style.width=(n/items.length*100)+"%";
            }
            paint();
            (async()=>{
            try{
            if(typeof claude==="undefined")return;
            const db=await claude.use("db");if(!db)return;
            dbh=db;
            db.collection("offert").onSnapshot(snap=>{
            snap.docs.forEach(d=>{const x=d.data();if(x&&typeof x.v==="boolean")saved[d.id]=x.v});
            try{localStorage.setItem("noel-done",JSON.stringify(saved))}catch(e){}
            paint();
            },()=>{});
            }catch(e){}
            })();
            const lt=document.getElementById("lights"),cols=["#6aa8ff","#ff7ac6","#ffe38a","#9be7ff"];
            for(let k=0;k<26;k++){const b=document.createElement("i");b.style.background=cols[k%4];b.style.boxShadow="0 0 10px "+cols[k%4];b.style.animationDelay=(k%5)*.3+"s";lt.appendChild(b)}
            for(let k=0;k<14;k++){const s=document.createElement("div");s.className="star";s.textContent="✦";s.style.left=Math.random()*100+"vw";s.style.top=Math.random()*60+"vh";s.style.fontSize=(10+Math.random()*14)+"px";s.style.animationDelay=Math.random()*3+"s";document.body.appendChild(s)}
            const bub=document.getElementById("bub"),lines=["Wouf ! 🎄","Je veux un câlin et des cartes ! 🃏","Joyeux Noël ! ✨","Mets-moi sur la liste aussi ! 🦴","Wouf wouf ! 💖"];
            let li=0;function say(t){bub.textContent=t}
            document.getElementById("dog").onclick=e=>{li=(li+1)%lines.length;say(lines[li]);
            for(let k=0;k<5;k++){const h=document.createElement("div");h.className="heart";h.textContent=["💖","✨","🐾","❄️"][k%4];h.style.left=(e.clientX-20+Math.random()*40)+"px";h.style.top=(e.clientY-10)+"px";document.body.appendChild(h);setTimeout(()=>h.remove(),1500)}};
            let last=0;addEventListener("pointermove",e=>{const n=Date.now();if(n-last<60)return;last=n;
            const s=document.createElement("div");s.className="sp";s.textContent=["✨","✦","❄"][Math.floor(Math.random()*3)];
            s.style.left=e.clientX+"px";s.style.top=e.clientY+"px";s.style.color=Math.random()<.5?"#ffc2e8":"#ffe38a";document.body.appendChild(s);setTimeout(()=>s.remove(),1000)});
            const cv=document.getElementById("snow"),cx=cv.getContext("2d");let W,H,fl=[];
            function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
            for(let k=0;k<55;k++)fl.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*9+7,s:Math.random()+.4,d:Math.random()*6,p:Math.random()<.3});
            (function f(){cx.clearRect(0,0,W,H);
            fl.forEach(o=>{cx.font=o.r+"px sans-serif";cx.globalAlpha=.8;cx.fillStyle=o.p?"#ffb3e1":"#fff";cx.fillText(o.p?"✦":"❄",o.x,o.y);
            o.y+=o.s;o.d+=.02;o.x+=Math.sin(o.d)*.6;if(o.y>H+20){o.y=-20;o.x=Math.random()*W}});
            requestAnimationFrame(f)})();
        </script>
    </body>
</html>
